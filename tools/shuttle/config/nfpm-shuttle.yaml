# nfpm config for the Shuttle .deb and .rpm. Rendered by scripts/package-deb.sh (envsubst on the ${SHUTTLE_*}
# variables only), never used directly.
#
# Depends/Requires are curated by hand (docs/TOOLING.md "Linux packages"): dpkg-shlibdeps on the build host overstates
# minimum versions (host symbol files, e.g. libc6 >= 2.34 from the libdl/libpthread stubs, libgbm1 >= 21.1 from weak
# symbols, libxcomposite1 >= 0.4.6) and only knows the host's t64 names. Minimums below follow upstream Chrome's
# expected deps (same Chromium sources, same Debian bullseye sysroot); libc6 >= 2.28 is the agent-browser sidecar's
# GLIBC_2.28 (shuttle itself needs 2.25). package-deb.sh cross-checks this list against dpkg-shlibdeps and the ELF
# NEEDED entries on every build and fails on a missing library.
# Not listed on purpose: libs we ship (libEGL, libGLESv2, libvulkan, swiftshader) and the Qt shims' deps (Chrome loads
# libqt5/6_shim only when Qt is installed).

name: shuttle
arch: amd64
platform: linux
version: ${SHUTTLE_PKG_VERSION}
version_schema: none
release: "1"
section: web
priority: optional
maintainer: Silkweave <tobias.strebitzer@gmail.com>
vendor: Silkweave
homepage: https://www.shuttlebrowser.com
license: BSD-3-Clause and others (see /opt/shuttle/about_credits.html)
description: |-
  Web browser for AI agents
  Shuttle is a Chromium-based browser for AI agents with a built-in MCP server
  (http://127.0.0.1:9222/mcp), per-agent profiles and a per-session CDP endpoint.
  Based on Chromium ${SHUTTLE_CHROMIUM_VERSION}.

contents:
  - src: ${SHUTTLE_STAGE}/opt/shuttle
    dst: /opt/shuttle
    type: tree
  # setuid sandbox helper (used where unprivileged user namespaces are unavailable, e.g. Ubuntu 23.10+ AppArmor).
  - src: ${SHUTTLE_STAGE}/chrome-sandbox
    dst: /opt/shuttle/chrome-sandbox
    file_info:
      mode: 04755
      owner: root
      group: root
  - src: /opt/shuttle/shuttle
    dst: /usr/bin/shuttle
    type: symlink
  # /usr/share + /etc (desktop file, icons, doc, repo key): one entry per file, generated by package-deb.sh, so the
  # packages don't claim system directories like /usr/share/icons/hicolor.
  - dst: /usr/share/doc/shuttle
    type: dir
    file_info:
      mode: 0755
${SHUTTLE_SHARE_CONTENTS}

scripts:
  postinstall: ${SHUTTLE_STAGE}/postinst
  postremove: ${SHUTTLE_STAGE}/postrm

overrides:
  deb:
    depends:
      - libasound2t64 (>= 1.0.17) | libasound2 (>= 1.0.17)
      - libatk-bridge2.0-0t64 (>= 2.5.3) | libatk-bridge2.0-0 (>= 2.5.3)
      - libatk1.0-0t64 (>= 2.11.90) | libatk1.0-0 (>= 2.11.90)
      - libatspi2.0-0t64 (>= 2.9.90) | libatspi2.0-0 (>= 2.9.90)
      - libc6 (>= 2.28)
      - libcairo2 (>= 1.6.0)
      - libcups2t64 (>= 1.6.0) | libcups2 (>= 1.6.0)
      - libdbus-1-3 (>= 1.9.14)
      - libexpat1 (>= 2.1~beta3)
      - libgbm1 (>= 17.1.0~rc2)
      - libgcc-s1 (>= 3.0)
      - libglib2.0-0t64 (>= 2.39.4) | libglib2.0-0 (>= 2.39.4)
      - libnspr4 (>= 2:4.9-2~)
      - libnss3 (>= 2:3.35)
      - libpango-1.0-0 (>= 1.14.0)
      - libudev1 (>= 183)
      - libx11-6 (>= 2:1.4.99.1)
      - libxcb1 (>= 1.9.2)
      - libxcomposite1 (>= 1:0.4.4-1)
      - libxdamage1 (>= 1:1.1)
      - libxext6
      - libxfixes3
      - libxkbcommon0 (>= 0.5.0)
      - libxrandr2
    recommends:
      # GTK is dlopen()ed (file dialogs, theme); headless/agent use runs without it.
      - libgtk-3-0t64 | libgtk-3-0 | libgtk-4-1
      - ca-certificates
      - fonts-liberation
      - xdg-utils
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - libatk-bridge-2.0.so.0()(64bit)
      - libatk-1.0.so.0()(64bit)
      - libatspi.so.0()(64bit)
      - libc.so.6(GLIBC_2.28)(64bit)
      - libcairo.so.2()(64bit)
      - libcups.so.2()(64bit)
      - libdbus-1.so.3()(64bit)
      - libexpat.so.1()(64bit)
      - libgbm.so.1()(64bit)
      - libgcc_s.so.1()(64bit)
      - libgio-2.0.so.0()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgobject-2.0.so.0()(64bit)
      - libnspr4.so()(64bit)
      - libnss3.so(NSS_3.39)(64bit)
      - libnssutil3.so()(64bit)
      - libsmime3.so()(64bit)
      - libpango-1.0.so.0()(64bit)
      - libudev.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcomposite.so.1()(64bit)
      - libXdamage.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libXrandr.so.2()(64bit)
    recommends:
      - (libgtk-3.so.0()(64bit) or libgtk-4.so.1()(64bit))
      - ca-certificates
      - liberation-fonts
      - xdg-utils

deb:
  compression: xz
  fields:
    Bugs: https://github.com/shuttle-browser/shuttle/issues

rpm:
  compression: xz
  group: Applications/Internet
  summary: Web browser for AI agents
